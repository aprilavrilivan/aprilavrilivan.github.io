<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1095" role="img" aria-labelledby="title desc">
  <title id="title">Evolution of Learning Based Humanoid Whole-body Control</title>
  <desc id="desc">Five learning paradigms increase along data diversity and task generalization.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#f8f4ed"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ead7c7"/>
      <stop offset="0.55" stop-color="#dda77f"/>
      <stop offset="1" stop-color="#c8662f"/>
    </linearGradient>
    <marker id="axis-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#c9c1b7"/>
    </marker>
    <marker
      id="flow-arrow"
      markerWidth="90"
      markerHeight="90"
      refX="80"
      refY="45"
      viewBox="0 0 90 90"
      markerUnits="userSpaceOnUse"
      orient="auto"
    >
      <path d="M0 0 90 45 0 90Z" fill="#c8662f"/>
    </marker>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#433125" flood-opacity="0.08"/>
    </filter>
    <style>
      .axis-label {
        fill: #192431;
        font: 760 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: -0.02em;
      }
      .flow-label {
        fill: #9e5633;
        font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.01em;
      }
      .level {
        fill: #fff;
        font: 800 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.04em;
      }
      .box-title {
        fill: #192431;
        font: 720 33px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: -0.02em;
      }
    </style>
  </defs>

  <rect width="2048" height="1095" rx="24" fill="url(#background)"/>

  <text class="axis-label" x="24" y="70">Data diversity</text>
  <line x1="76" y1="972" x2="76" y2="138" stroke="#c9c1b7" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <line x1="76" y1="972" x2="2016" y2="972" stroke="#c9c1b7" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <text class="axis-label" x="1024" y="1032" text-anchor="middle">Task generalization</text>

  <path
    d="M230 880 C660 857 1200 775 1880 558"
    fill="none"
    stroke="url(#flow)"
    stroke-linecap="round"
    stroke-width="25"
    marker-end="url(#flow-arrow)"
  />
  <text class="flow-label" x="1075" y="833" transform="rotate(-13 1075 833)">
    Increasing data diversity and task generalizability
  </text>

  <g transform="translate(145 560)" filter="url(#card-shadow)">
    <rect width="340" height="210" rx="20" fill="#f5f0e9" stroke="#c8b7aa" stroke-width="2"/>
    <rect x="24" y="22" width="66" height="43" rx="10" fill="#856a58"/>
    <text class="level" x="38" y="53">L1</text>
    <text class="box-title" x="24" y="126">Reward-defined</text>
    <text class="box-title" x="24" y="171">Control</text>
  </g>

  <g transform="translate(515 470)" filter="url(#card-shadow)">
    <rect width="340" height="210" rx="20" fill="#f7eee6" stroke="#d1b49e" stroke-width="2"/>
    <rect x="24" y="22" width="66" height="43" rx="10" fill="#9e6c4b"/>
    <text class="level" x="38" y="53">L2</text>
    <text class="box-title" x="24" y="126">Motion-reference</text>
    <text class="box-title" x="24" y="171">Control</text>
  </g>

  <g transform="translate(885 380)" filter="url(#card-shadow)">
    <rect width="340" height="210" rx="20" fill="#f7e9df" stroke="#d7a27f" stroke-width="2"/>
    <rect x="24" y="22" width="66" height="43" rx="10" fill="#ae6741"/>
    <text class="level" x="38" y="53">L3</text>
    <text class="box-title" x="24" y="126">Context-rich</text>
    <text class="box-title" x="24" y="171">Interaction</text>
  </g>

  <g transform="translate(1255 290)" filter="url(#card-shadow)">
    <rect width="340" height="210" rx="20" fill="#f5e2d5" stroke="#cf895f" stroke-width="2"/>
    <rect x="24" y="22" width="66" height="43" rx="10" fill="#b65f35"/>
    <text class="level" x="38" y="53">L4</text>
    <text class="box-title" x="24" y="126">Multimodal</text>
    <text class="box-title" x="24" y="171">Generalist Control</text>
  </g>

  <g transform="translate(1625 200)" filter="url(#card-shadow)">
    <rect width="340" height="210" rx="20" fill="#f1d8c7" stroke="#bd693e" stroke-width="2"/>
    <rect x="24" y="22" width="66" height="43" rx="10" fill="#a84c25"/>
    <text class="level" x="38" y="53">L5</text>
    <text class="box-title" x="24" y="126">Predictive</text>
    <text class="box-title" x="24" y="171">World-Action Models</text>
  </g>
</svg>
