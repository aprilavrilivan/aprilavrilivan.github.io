<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1152" role="img" aria-labelledby="title desc">
  <title id="title">Evolution of Learning Based Humanoid Whole-body Control</title>
  <desc id="desc">Five learning paradigms increase along data diversity and task generalization.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#f8f4ed"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ead7c7"/>
      <stop offset="0.55" stop-color="#dda77f"/>
      <stop offset="1" stop-color="#c8662f"/>
    </linearGradient>
    <marker id="axis-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#c9c1b7"/>
    </marker>
    <marker
      id="flow-arrow"
      markerWidth="76"
      markerHeight="70"
      refX="14"
      refY="35"
      viewBox="0 0 72 70"
      markerUnits="userSpaceOnUse"
      orient="auto"
    >
      <path d="M0 5 L68 35 L0 65 Z" fill="#c8662f"/>
    </marker>
    <path id="flow-label-path" d="M225 928 C665 900 1240 765 1760 555"/>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#433125" flood-opacity="0.08"/>
    </filter>
    <style>
      .axis-label {
        fill: #192431;
        font: 760 44px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: -0.02em;
      }
      .flow-label {
        fill: #9e5633;
        font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.01em;
      }
      .level {
        fill: #fff;
        font: 800 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.04em;
      }
      .box-title {
        fill: #192431;
        font: 720 44px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: -0.02em;
      }
    </style>
  </defs>

  <rect width="2048" height="1152" rx="24" fill="url(#background)"/>

  <text class="axis-label" x="24" y="74">Data diversity</text>
  <line x1="72" y1="1035" x2="72" y2="145" stroke="#c9c1b7" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <line x1="72" y1="1035" x2="2016" y2="1035" stroke="#c9c1b7" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <text class="axis-label" x="1024" y="1100" text-anchor="middle">Task generalization</text>

  <path
    d="M180 970 C650 940 1250 800 1880 520"
    fill="none"
    stroke="url(#flow)"
    stroke-linecap="butt"
    stroke-width="25"
    marker-end="url(#flow-arrow)"
  />
  <text class="flow-label" text-anchor="middle">
    <textPath href="#flow-label-path" startOffset="55%">
      Increasing data diversity and task generalizability
    </textPath>
  </text>

  <g transform="translate(105 675)" filter="url(#card-shadow)">
    <rect width="365" height="270" rx="20" fill="#f5f0e9" stroke="#c8b7aa" stroke-width="2"/>
    <rect x="24" y="22" width="70" height="45" rx="10" fill="#856a58"/>
    <text class="level" x="39" y="55">L1</text>
    <text class="box-title" x="24" y="128">Robust</text>
    <text class="box-title" x="24" y="181">Command</text>
    <text class="box-title" x="24" y="234">Following</text>
  </g>

  <g transform="translate(485 545)" filter="url(#card-shadow)">
    <rect width="365" height="270" rx="20" fill="#f7eee6" stroke="#d1b49e" stroke-width="2"/>
    <rect x="24" y="22" width="70" height="45" rx="10" fill="#9e6c4b"/>
    <text class="level" x="39" y="55">L2</text>
    <text class="box-title" x="24" y="128">Expressive</text>
    <text class="box-title" x="24" y="181">Motion</text>
    <text class="box-title" x="24" y="234">Generation</text>
  </g>

  <g transform="translate(865 415)" filter="url(#card-shadow)">
    <rect width="365" height="270" rx="20" fill="#f7e9df" stroke="#d7a27f" stroke-width="2"/>
    <rect x="24" y="22" width="70" height="45" rx="10" fill="#ae6741"/>
    <text class="level" x="39" y="55">L3</text>
    <text class="box-title" x="24" y="152">Context-rich</text>
    <text class="box-title" x="24" y="211">Interaction</text>
  </g>

  <g transform="translate(1245 285)" filter="url(#card-shadow)">
    <rect width="365" height="270" rx="20" fill="#f5e2d5" stroke="#cf895f" stroke-width="2"/>
    <rect x="24" y="22" width="70" height="45" rx="10" fill="#b65f35"/>
    <text class="level" x="39" y="55">L4</text>
    <text class="box-title" x="24" y="128">Multimodal</text>
    <text class="box-title" x="24" y="181">Task</text>
    <text class="box-title" x="24" y="234">Grounding</text>
  </g>

  <g transform="translate(1625 155)" filter="url(#card-shadow)">
    <rect width="365" height="270" rx="20" fill="#f1d8c7" stroke="#bd693e" stroke-width="2"/>
    <rect x="24" y="22" width="70" height="45" rx="10" fill="#a84c25"/>
    <text class="level" x="39" y="55">L5</text>
    <text class="box-title" x="24" y="128">Predictive</text>
    <text class="box-title" x="24" y="181">Decision</text>
    <text class="box-title" x="24" y="234">Making</text>
  </g>
</svg>
